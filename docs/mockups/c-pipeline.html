<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountable - Mockup C - Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Mockup C: "Open plan". Full-width board, each column tinted in its stage colour, compact white cards. */
  :root {
    --page: #F0F4F5; --panel: #FFFFFF; --ink: #073B4C; --muted: #4D6973; --line: #E8EEF0;
    --sea: #06D6A0; --sea-text: #067A5C; --rasp-text: #C2264F; --rasp-tint: #FDECF0;
    --mist: #CDD8DB;
    --sans: "Instrument Sans", system-ui, sans-serif; --serif: "Instrument Serif", Georgia, serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--sans); }
  .wrap { padding: 20px 32px 32px; max-width: 1440px; margin: 0 auto; position: relative; }
  .bar { display: flex; align-items: center; gap: 28px; background: var(--panel); border-radius: 18px; padding: 10px 12px 10px 18px; box-shadow: 0 1px 2px rgba(7,59,76,.06); margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--sea); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .tabs { display: flex; gap: 4px; }
  .tabs a { padding: 8px 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; }
  .tabs a.on { background: var(--ink); color: #fff; }
  .bar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
  .btn { font: 600 14px var(--sans); border: 0; border-radius: 10px; padding: 9px 16px; background: var(--sea); color: var(--ink); }
  .head { display: grid; grid-template-columns: 1fr 420px; gap: 32px; align-items: end; margin-bottom: 22px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .lede { font-family: var(--serif); font-size: 36px; line-height: 1.15; margin: 6px 0 0; font-weight: 400; }
  .lede .hl { color: var(--sea-text); }
  .sum .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .sum .row b { font: 500 13px var(--mono); color: var(--ink); }
  .stack { display: flex; gap: 2px; height: 12px; }
  .stack div { border-radius: 4px; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; height: 700px; }
  .col { border-radius: 18px; padding: 12px 10px; display: flex; flex-direction: column; min-height: 0; }
  .ch { padding: 2px 4px 12px; }
  .ch .t { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; font-size: 15px; }
  .ch .t span { font: 500 12px var(--mono); }
  .ch .v { font: 500 17px var(--mono); margin-top: 4px; letter-spacing: -0.02em; }
  .ch .e { font: 400 12px var(--mono); opacity: .85; }
  .add { font: 600 13px var(--sans); background: rgba(255,255,255,.6); border: 0; border-radius: 10px; padding: 7px; margin-bottom: 10px; color: var(--ink); }
  .cards { overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .card { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 1px 2px rgba(7,59,76,.06); }
  .card .nm { font-weight: 600; font-size: 13px; }
  .card .org { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .card .val { font: 500 13px var(--mono); }
  .card .date { font: 400 11px var(--mono); color: var(--muted); }
  .card.late .date { color: var(--rasp-text); font-weight: 500; }
  .late-tag { display: inline-block; font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--rasp-text); background: var(--rasp-tint); border-radius: 999px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
  .slot { border-radius: 12px; height: 74px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 2px #B4472A; flex: none; }
  .drag { position: absolute; transform: rotate(1.5deg); box-shadow: 0 14px 30px rgba(7,59,76,.22); z-index: 5; }
  .more { font-size: 12px; text-align: center; padding: 6px; opacity: .8; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="bar">
    <div class="brand"><span class="mark">A</span>Accountable</div>
    <nav class="tabs"><a href="c-dashboard.html">Dashboard</a><a class="on" href="#">Pipeline</a><a href="#">Deals</a><a href="#">Contacts</a><a href="#">Organizations</a></nav>
    <div class="right"><span>Mockup C · Open plan</span><button class="btn">+ New deal</button></div>
  </header>

  <div class="head">
    <div><div class="eyebrow">Pipeline</div><h1 class="lede">14 open deals worth <span class="hl">$1.130.000,00</span>, expected to bring in $529.500,00.</h1></div>
    <div class="sum">
      <div class="stack"><div style="flex:120;background:#118AB2"></div><div style="flex:310;background:#FFC145"></div><div style="flex:340;background:#F78C6B"></div><div style="flex:360;background:#073B4C"></div></div>
      <div class="row"><span>Open value by stage</span><span>New · Qualified · Proposal · Negotiation</span></div>
      <div class="row"><span>3 open deals are late</span><b>$220.000,00</b></div>
    </div>
  </div>

  <div class="board" id="board"></div>
</div>
<script src="pipeline-data.js"></script>
<script>
const money2 = n => '$' + n.toLocaleString('de-DE', {minimumFractionDigits:2});
const tint = { new:['#E7F3F7','#0D6E8F'], qualified:['#FFF6E3','#8A5A00'], proposal:['#FEEEE9','#B4472A'], negotiation:['#E3EBEE','#073B4C'], won:['#E6FBF5','#067A5C'], lost:['#EAEFF1','#4D6973'] };
const cardHtml = d => `<div class="nm">${d.name}${d.late ? '<span class="late-tag">Late</span>' : ''}</div>
  <div class="org">${d.org}${d.contact ? ' · ' + d.contact : ''}</div>
  <div class="row"><span class="val">${money2(d.v)}</span><span class="date">${d.date}</span></div>`;
document.getElementById('board').innerHTML = STAGES.map(s => {
  const open = s.p > 0 && s.p < 100, [bg, fg] = tint[s.key];
  const shown = s.deals.filter(d => !d.dragging);
  const hidden = s.count - shown.filter(d => !d.slot).length - (s.deals.some(d => d.dragging) ? 1 : 0);
  return `<div class="col" style="background:${bg};color:${fg}">
    <div class="ch"><div class="t">${s.n}<span>${s.count} · ${s.p}%</span></div>
      <div class="v">${money2(s.total)}</div>
      <div class="e">${open ? 'exp ' + money2(s.total*s.p/100) : (s.key === 'won' ? 'closed, won' : 'closed, lost')}</div></div>
    ${open ? '<button class="add">+ Add deal</button>' : ''}
    <div class="cards" style="color:var(--ink)">${shown.map(d => d.slot ? '<div class="slot"></div>' : `<div class="card ${d.late ? 'late' : ''}">${cardHtml(d)}</div>`).join('')}
      ${hidden > 0 ? `<div class="more" style="color:${fg}">${hidden} more below</div>` : ''}</div>
  </div>`;
}).join('');
const wrap = document.getElementById('wrap'), slot = document.querySelector('.slot');
const wr = wrap.getBoundingClientRect(), sr = slot.getBoundingClientRect();
const g = document.createElement('div'); g.className = 'card drag late'; g.innerHTML = cardHtml(DRAGGED);
g.style.width = sr.width + 'px'; g.style.left = (sr.left - wr.left + 8) + 'px'; g.style.top = (sr.top - wr.top - 6) + 'px';
wrap.appendChild(g);
</script>
</body>
</html>
