<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accountable</title>
    <!--
      The saved theme choice (light, dark or system), applied before anything draws,
      so a page in dark mode never shows light first, the sign-in screen included.
      It has to be a plain inline script: a module script runs too late. Same key
      and rule as src/lib/theme.ts.
    -->
    <script>
      try {
        var choice = localStorage.getItem('accountable-theme');
        var deviceIsDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (choice === 'dark' || (choice === 'system' && deviceIsDark)) document.documentElement.dataset.theme = 'dark';
      } catch {
        // The browser blocks storage: stay in light mode, the default.
      }
    </script>
    <!-- Loaded here rather than from main.tsx, so the colours apply while the app's code is still loading. -->
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
